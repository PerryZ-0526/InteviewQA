name: Publish mobile content

on:
  push:
    branches: [main]
    paths:
      - categories/**
      - groups/**
      - project/**
      - tags/**
      - mobile/scripts/build-sync-content.mjs
      - mobile/scripts/content-manifest.mjs
      - mobile/scripts/sync-manifest.mjs
      - mobile/src/content.js
      - .github/workflows/mobile-content-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-content-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mobile/scripts/build-sync-content.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/sync-dist
      - id: deployment
        uses: actions/deploy-pages@v4
